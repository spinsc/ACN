<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3f44"/>
      <stop offset="1" stop-color="#15181b"/>
    </linearGradient>
    <radialGradient id="green" cx="45%" cy="40%">
      <stop offset="0" stop-color="#c8ffcf"/>
      <stop offset=".25" stop-color="#39ff62"/>
      <stop offset=".65" stop-color="#00c936"/>
      <stop offset="1" stop-color="#087d27"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Traffic light body -->
  <rect x="31" y="7" width="66" height="108" rx="8" fill="url(#body)" stroke="#0d0f11" stroke-width="2"/>

  <!-- Side visors -->
  <path d="M31 17H21L26 34H31Z M97 17H107L102 34H97Z
           M31 49H21L26 66H31Z M97 49H107L102 66H97Z
           M31 81H21L26 98H31Z M97 81H107L102 98H97Z"
        fill="#24282c" stroke="#111315" stroke-width="1.5"/>

  <!-- Red -->
  <circle cx="64" cy="27" r="15" fill="#120e0f" stroke="#55595c" stroke-width="2"/>
  <circle cx="64" cy="27" r="10.5" fill="#4b1719"/>

  <!-- Yellow -->
  <circle cx="64" cy="59" r="15" fill="#141210" stroke="#55595c" stroke-width="2"/>
  <circle cx="64" cy="59" r="10.5" fill="#5b4312"/>

  <!-- Green illuminated -->
  <circle cx="64" cy="91" r="17" fill="#08210e" stroke="#4f5952" stroke-width="2"/>
  <circle cx="64" cy="91" r="12.5" fill="url(#green)" filter="url(#glow)"/>
  <circle cx="60" cy="87" r="3" fill="#ffffff" opacity=".65"/>

  <!-- Bottom post -->
  <rect x="57" y="115" width="14" height="7" rx="2" fill="#202428"/>
</svg>